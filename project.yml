name: WatchOnMy
options:
  bundleIdPrefix: com.sungdotio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: YQPVRPSS5F
    CODE_SIGN_STYLE: Automatic
targets:
  WatchOnMy:
    type: application
    platform: iOS
    sources:
      - path: WatchOnMy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sungdotio.watchonmy
        PRODUCT_NAME: WatchOnMy
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: WatchOnMy/Info.plist
      properties:
        CFBundleDisplayName: "Watch on My..."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen:
          UIColorName: LaunchBackground
  WatchOnMyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WatchOnMyTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sungdotio.watchonmy.tests
    dependencies:
      - target: WatchOnMy
schemes:
  WatchOnMy:
    build:
      targets:
        WatchOnMy: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [WatchOnMyTests]
    archive:
      config: Release
